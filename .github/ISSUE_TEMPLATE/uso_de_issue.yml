name: Plantilla para que los issues que se abran sigan las buenas prácticas
description: Usa esta plantilla cuando crees un issue para registrar un problema en el proyecto que haya que solucionar.

body:
  - type: markdown
    attributes:
      value: |
        # Plantilla para para que los issues que se abran sigan las buenas prácticas
        **Buena Práctica:** Un buen Issue representa siempre un problema **Claro**, **Conciso** y **Accionable** y nunca expresa una solución.
        Por favor, sigue las instrucciones de cada campo para facilitar la clasificación y el inicio rápido del trabajo.

  - type: textarea
    id: descripcion-problema
    attributes:
      label: Descripción detallada del problema
      description: "Describe de la forma más clara y concisa posible el problema."
      placeholder: "Escriba aquí"
    validations:
      required: true
    
  - type: checkboxes
    id: comprobaciones
    attributes:
      label: Lista de comprobación
      description: Verifica que has revisado estos puntos antes de crear el issue.
      options:
        - label: ¿Tiene realmente relevancia en este proyecto este problema?
        - label: ¿Estoy expresando un problema?
        - label: ¿Solo expreso problemas y no doy una solución explícita en la descripción de este issue?
        - label: He comprobado que este issue no está duplicado.
        - label: He incluido toda la información necesaria para comenzar a trabajar.
        - label: Mi Issue se enfoca en el QUÉ (el problema/necesidad), no en el CÓMO (la solución).
        - label: Si este trabajo está relacionado con otro Issue o Pull Request, lo he mencionado en la descripción.
        - label: Si este Issue añade una funcionalidad, he recordado que necesita actualizar la documentación (o crear un Issue de documentación).
        - label: He usado los @mentions para notificar a la persona o equipo directamente relevante.
        - label: He asignado las etiquetas adecuadas a este Issue.
        - label: He asignado este issue al milestone que corresponde.
    validations:
      required: true
